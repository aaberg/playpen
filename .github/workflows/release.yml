name: release

on:
  release:
    types: [published]

# Serialize publication; GitHub's current Latest release controls the stable
# image channel, not tag ordering.
concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/aaberg
  IMAGES: playpen-base playpen-rust playpen-jvm
  TAG: ${{ github.event.release.tag_name }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      skip-containers: true
    permissions:
      contents: read

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
            target: x86_64-unknown-linux-musl
            suffix: x86_64-linux-musl
          - runner: ubuntu-26.04-arm
            arch: arm64
            target: aarch64-unknown-linux-musl
            suffix: aarch64-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      CANDIDATE: ${{ github.event.release.tag_name }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
      BUILD_ARGS: --label org.opencontainers.image.revision=${{ github.sha }} --label org.opencontainers.image.version=${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - name: Check release tag matches launcher version
        id: version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("launcher/Cargo.toml", "rb"))["package"]["version"])')
          if test "$TAG" != "v$version"; then
            echo "Release tag $TAG must match launcher version v$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Install stable Rust and musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Build and package launcher
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo build --release --locked --manifest-path launcher/Cargo.toml --target "${{ matrix.target }}"
          asset="playpen-${{ matrix.suffix }}.tar.gz"
          tar -czf "$asset" -C "launcher/target/${{ matrix.target }}/release" playpen
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$asset" -C "$RUNNER_TEMP/package"
          test "$("$RUNNER_TEMP/package/playpen" --version)" = "playpen $VERSION"
      - name: Build base image
        run: make base ENGINE=docker
      - name: Build Rust flavor
        run: make rust ENGINE=docker
      - name: Build JVM flavor
        run: make jvm ENGINE=docker
      - name: Smoke extracted launcher and exact candidate images
        run: python3 scripts/smoke.py --engine docker --launcher "$RUNNER_TEMP/package/playpen"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push base image
        run: |
          docker tag playpen-base:latest "$REGISTRY/playpen-base:$CANDIDATE"
          docker --debug push "$REGISTRY/playpen-base:$CANDIDATE"
      - name: Push Rust image
        run: |
          docker tag playpen-rust:latest "$REGISTRY/playpen-rust:$CANDIDATE"
          docker --debug push "$REGISTRY/playpen-rust:$CANDIDATE"
      - name: Push JVM image
        run: |
          docker tag playpen-jvm:latest "$REGISTRY/playpen-jvm:$CANDIDATE"
          docker --debug push "$REGISTRY/playpen-jvm:$CANDIDATE"
      - name: Record registry digests
        run: |
          mkdir -p "image-digests/${{ matrix.arch }}"
          for image in $IMAGES; do
            ref="$REGISTRY/$image:$CANDIDATE"
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
            printf '%s@%s\n' "$REGISTRY/$image" "$digest" > "image-digests/${{ matrix.arch }}/$image"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: image-digests-${{ matrix.arch }}
          path: image-digests/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: playpen-${{ matrix.suffix }}
          path: playpen-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  manifests:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: image-digests-*
          path: image-digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Assemble and verify versioned multiarch indexes
        run: |
          mkdir -p release-image-digests
          for image in $IMAGES; do
            amd64=$(cat "image-digests/amd64/$image")
            arm64=$(cat "image-digests/arm64/$image")
            ref="$REGISTRY/$image:$TAG"
            # Each source can itself be an OCI index containing provenance.
            docker buildx imagetools create --tag "$ref" "$amd64" "$arm64"
            docker buildx imagetools inspect "$ref" --raw | jq -e '
              [.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
            digest=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
            printf '%s@%s\n' "$REGISTRY/$image" "$digest" > "release-image-digests/$image"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-image-digests
          path: release-image-digests/
          if-no-files-found: error

  consumers:
    needs: [build, manifests]
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
        platform:
          - runner: ubuntu-26.04
            arch: amd64
            suffix: x86_64-linux-musl
          - runner: ubuntu-26.04-arm
            arch: arm64
            suffix: aarch64-linux-musl
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: playpen-${{ matrix.platform.suffix }}
          path: package
      - uses: actions/download-artifact@v8
        with:
          name: release-image-digests
          path: release-image-digests
      - name: Set up rootless Podman
        if: matrix.engine == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          systemctl --user start podman.socket
          test -S "/run/user/$(id -u)/podman/podman.sock"
      - name: Verify anonymous versioned pulls on native architecture
        env:
          ENGINE: ${{ matrix.engine }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          export REGISTRY_AUTH_FILE="$RUNNER_TEMP/anonymous-auth.json"
          mkdir -p "$DOCKER_CONFIG"
          printf '{"auths":{}}\n' > "$REGISTRY_AUTH_FILE"
          for image in $IMAGES; do
            ref="$REGISTRY/$image:$TAG"
            expected=$(cat "release-image-digests/$image")
            # Use a manifest GET independent of the selected engine's cache.
            actual=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -er '.digest')
            test "$expected" = "$REGISTRY/$image@$actual"
            "$ENGINE" pull "$ref"
            test "$("$ENGINE" image inspect "$ref" --format '{{.Architecture}}')" = "$ARCH"
            "$ENGINE" tag "$ref" "$image:latest"
          done
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "package/playpen-${{ matrix.platform.suffix }}.tar.gz" -C "$RUNNER_TEMP/package"
          python3 scripts/smoke.py --engine "$ENGINE" --launcher "$RUNNER_TEMP/package/playpen"

  publish:
    needs: consumers
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: playpen-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-image-digests
          path: release-image-digests
      - name: Attach artifacts to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum playpen-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          # Reruns replace generated assets without editing the release itself.
          gh release upload "$TAG" playpen-*.tar.gz SHA256SUMS install.sh --clobber
      - name: Check GitHub's current Latest release
        id: latest
        if: ${{ !github.event.release.prerelease }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          if test "$latest" = "$TAG"; then
            echo 'promote=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v4
        if: steps.latest.outputs.promote == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified Latest release indexes
        if: steps.latest.outputs.promote == 'true'
        run: |
          for image in $IMAGES; do
            source=$(cat "release-image-digests/$image")
            docker buildx imagetools create --tag "$REGISTRY/$image:latest" "$source"
          done
          # Verify the public aliases resolve to exactly the tested indexes.
          export DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker"
          mkdir -p "$DOCKER_CONFIG"
          for image in $IMAGES; do
            digest=$(docker buildx imagetools inspect "$REGISTRY/$image:latest" --format '{{json .Manifest}}' | jq -er '.digest')
            test "$(cat "release-image-digests/$image")" = "$REGISTRY/$image@$digest"
          done
