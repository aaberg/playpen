name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-containers:
        description: Skip real-engine coverage when the release tests its exact published images
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow expressions and shell steps
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  launcher:
    name: launcher (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Run unit and launcher integration tests
        run: cargo +stable test --locked
      - name: Check Clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  containers:
    name: packaged launcher (${{ matrix.platform.suffix }}, ${{ matrix.engine }})
    # Reusable release callers can omit only expensive real-engine coverage;
    # native unit/integration tests and formatting/Clippy always run above.
    if: ${{ !inputs.skip-containers }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
        platform:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            suffix: x86_64-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            suffix: aarch64-linux-musl
    env:
      ENGINE: ${{ matrix.engine }}
      TARGET: ${{ matrix.platform.target }}
      SUFFIX: ${{ matrix.platform.suffix }}
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust and musl target
        run: rustup toolchain install stable --profile minimal --target "$TARGET"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Set up rootless Podman
        if: matrix.engine == 'podman'
        run: |
          sudo apt-get install -y podman uidmap slirp4netns fuse-overlayfs dbus-user-session
          # Ubuntu's AppArmor user-namespace restriction otherwise blocks
          # rootless Podman. Containers themselves receive no privileges.
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Allow Podman to stop pasta (actions/runner-images#15182).
          sudo sed -i '$ i\  signal (receive) set=(term) peer=podman,' /etc/apparmor.d/usr.bin.pasta
          sudo apparmor_parser -r /etc/apparmor.d/usr.bin.pasta
          systemctl --user start podman.socket
          test -S "/run/user/$(id -u)/podman/podman.sock"
      - name: Check selected engine as runner user
        run: |
          test "$(id -u)" -ne 0
          "$ENGINE" info
      - name: Build all local images
        run: make all ENGINE="$ENGINE"
      - name: Build and package static launcher
        run: |
          cargo +stable build --release --locked --target "$TARGET"
          tar -czf "$RUNNER_TEMP/playpen-$SUFFIX.tar.gz" \
            -C "target/$TARGET/release" playpen
      - name: Extract packaged launcher and check manifest version
        run: |
          mkdir -p "$RUNNER_TEMP/playpen-package"
          tar -xzf "$RUNNER_TEMP/playpen-$SUFFIX.tar.gz" -C "$RUNNER_TEMP/playpen-package"
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["version"]
          launcher = pathlib.Path(os.environ["RUNNER_TEMP"]) / "playpen-package" / "playpen"
          actual = subprocess.check_output([str(launcher), "--version"], text=True).strip()
          expected = f"playpen {version}"
          if actual != expected:
              raise SystemExit(f"packaged launcher version: expected {expected!r}, got {actual!r}")
          print(actual)
          PY
      - name: Smoke extracted launcher with real engine
        run: python3 scripts/smoke.py --engine "$ENGINE" --launcher "$RUNNER_TEMP/playpen-package/playpen"
      - name: Upload tested package
        uses: actions/upload-artifact@v7
        with:
          name: playpen-${{ matrix.platform.suffix }}-${{ matrix.engine }}
          path: ${{ runner.temp }}/playpen-${{ matrix.platform.suffix }}.tar.gz
          if-no-files-found: error
