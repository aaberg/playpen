# Build base + flavors on native amd64/arm64 runners, push arch-suffixed
# images to ghcr.io, then merge them into multi-arch manifests tagged
# :latest. The launcher pulls these when a flavor is missing locally
# (ROADMAP.md phase 3); harness images are never published.
name: images

on:
  push:
    branches: [main]
    paths: [base/**, flavors/**, Makefile, .github/workflows/images.yml]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Must match the launcher's DEFAULT_REGISTRY (launcher/src/images.rs):
  # podman/docker pick the right architecture from the multi-arch manifest.
  REGISTRY: ghcr.io
  OWNER: aaberg
  IMAGES: playpen-base playpen-rust playpen-jvm

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: amd64
          - runner: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push arch images
        run: |
          make all ENGINE=docker
          for image in $IMAGES; do
            docker tag "$image:latest" "$REGISTRY/$OWNER/$image:latest-${{ matrix.arch }}"
            docker push "$REGISTRY/$OWNER/$image:latest-${{ matrix.arch }}"
          done

  manifest:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: merge into multi-arch manifests
        run: |
          for image in $IMAGES; do
            ref="$REGISTRY/$OWNER/$image:latest"
            docker manifest create "$ref" \
              "$REGISTRY/$OWNER/$image:latest-amd64" \
              "$REGISTRY/$OWNER/$image:latest-arm64"
            docker manifest push "$ref"
          done
